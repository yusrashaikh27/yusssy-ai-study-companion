name: ai_companion
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  file_picker: ^13.1.0
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/yusssy_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/yusssy_logo.png"
  adaptive_icon_background: "#F7F1E8"
  adaptive_icon_foreground: "assets/images/yusssy_logo.png"

flutter_native_splash:
  color: "#F7F1E8"
  image: "assets/images/yusssy_logo.png"
  android: true
  ios: false
  android_12:
    color: "#F7F1E8"
    image: "assets/images/yusssy_logo.png"